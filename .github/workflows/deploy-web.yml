# Publishes the web version to Netlify on every push to main, after the tests pass.
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   NETLIFY_AUTH_TOKEN  a personal access token (Netlify: User settings → Applications)
#   NETLIFY_SITE_ID     the site's ID (Netlify: Site configuration → Site details)
# Until they're set, the deploy is skipped with a note. If the Netlify site is also linked to the
# repo for automatic builds, turn those off so each push deploys once.
name: Deploy web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-web
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Publish to Netlify
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
    steps:
      - name: Get the built site
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist

      - name: Deploy
        id: deploy
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ] || [ -z "$NETLIFY_SITE_ID" ]; then
            echo "::notice::Skipping the web deploy: add the NETLIFY_AUTH_TOKEN and NETLIFY_SITE_ID secrets to turn it on."
            exit 0
          fi
          npx --yes netlify-cli@27.10.2 deploy --prod --dir dist --site "$NETLIFY_SITE_ID" \
            --message "${GITHUB_SHA::7} ($GITHUB_EVENT_NAME)" --json > deploy.json
          url=$(node -e "const d=require('./deploy.json'); console.log(d.deploy_url || d.url || '')")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed: $url" >> "$GITHUB_STEP_SUMMARY"
