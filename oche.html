<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Oche Scorer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=Caveat:wght@500;700&display=swap">
<style>
/* Layout: a pub oche — players and keypad on the left; the board under a spotlight and the chalker's board on the right; stacks on phones.
   Palette comes from the dartboard itself: felt green for whoever is throwing, board red for actions, board cream for numerals. */
:root {
  --bg: #eceee9;
  --glow: rgba(255, 255, 255, .9);
  --surface: #ffffff;
  --surface-2: #f3f5f1;
  --ink: #141a17;
  --muted: #5b6761;
  --line: #dce1dc;
  --red: #bf2731;
  --red-2: #9e1c25;
  --green: #11804a;
  --on-ink: #f4f7f4;
  --warn: #9a5b00;
  --felt: #17573d;
  --felt-2: #0e3a28;
  --on-felt: #f6eed6;
  --cream: #efe2bd;
  --wall: #e3e7e1;
  --spot: rgba(255, 255, 255, .95);
  --chalk-bg: #1f2725;
  --chalk: #eef3ee;
  --chalk-dim: #9fb1a7;
  --shadow: 0 1px 2px rgba(20, 26, 23, .06), 0 8px 24px -16px rgba(20, 26, 23, .25);
  --board-black: #1b1d1c;
  --board-cream: #e8dcbc;
  --board-red: #c6262f;
  --board-green: #12814a;
  --board-wire: #9a9d9b;
  --font-display: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", sans-serif;
  --font-body: "Barlow", "Helvetica Neue", Arial, sans-serif;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b100e; --glow: rgba(239, 226, 189, .07); --surface: #141b18; --surface-2: #1a231f; --ink: #e9eee9; --muted: #93a19a;
    --line: #24302a; --red: #e04850; --red-2: #b82a32; --green: #3cb77a; --on-ink: #0e1210; --warn: #e3a64a;
    --felt: #1a6146; --felt-2: #0e3b29; --wall: #0e1412; --spot: rgba(255, 236, 196, .13); --chalk-bg: #1a2220;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 30px -18px rgba(0, 0, 0, .8);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b100e; --glow: rgba(239, 226, 189, .07); --surface: #141b18; --surface-2: #1a231f; --ink: #e9eee9; --muted: #93a19a;
  --line: #24302a; --red: #e04850; --red-2: #b82a32; --green: #3cb77a; --on-ink: #0e1210; --warn: #e3a64a;
  --felt: #1a6146; --felt-2: #0e3b29; --wall: #0e1412; --spot: rgba(255, 236, 196, .13); --chalk-bg: #1a2220;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 30px -18px rgba(0, 0, 0, .8);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: radial-gradient(1100px 420px at 50% -160px, var(--glow), transparent 70%) no-repeat, var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px 40px;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }
.num { font-family: var(--font-display); font-variant-numeric: tabular-nums; }
.label { font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }

.wrap { max-width: 1120px; margin: 0 auto; display: grid; gap: 16px; }
header.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.brand h1 { font-family: var(--font-display); font-weight: 700; font-size: 30px; letter-spacing: .06em; margin: 0; text-transform: uppercase; display: flex; align-items: center; gap: 10px; cursor: pointer; }
.brand .logo svg { width: 30px; height: 30px; display: block; filter: drop-shadow(0 2px 4px rgba(0, 0, 0, .3)); }
.brand h1 .dot { color: var(--red); }
.meta { color: var(--muted); font-size: 14px; }
.btn {
  border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 8px 16px; font-weight: 600;
  box-shadow: var(--shadow); transition: border-color .15s, transform .15s;
}
.btn:hover { border-color: var(--muted); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--ink); color: var(--on-ink); border-color: var(--ink); }

.grid { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 860px) { .grid { grid-template-columns: minmax(0, 1fr); } }
.col { display: grid; gap: 16px; min-width: 0; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; min-width: 0; box-shadow: var(--shadow); }

/* Scoreboard */
.players { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
.player {
  border-radius: 14px; padding: 14px 16px 12px; background: var(--surface); border: 1px solid var(--line);
  display: grid; gap: 4px; min-width: 0; transition: background .25s, color .25s, box-shadow .25s; box-shadow: var(--shadow);
}
.player .rem { color: color-mix(in srgb, var(--ink) 55%, transparent); transition: color .25s; }
.player.active {
  background: radial-gradient(120% 90% at 20% 0%, color-mix(in srgb, var(--felt) 70%, #fff 8%), transparent 70%), linear-gradient(160deg, var(--felt), var(--felt-2));
  color: var(--on-felt); border-color: transparent; box-shadow: 0 14px 34px -16px rgba(9, 40, 27, .8), inset 0 1px 0 rgba(255, 255, 255, .08);
}
.player.active .rem { color: var(--on-felt); text-shadow: 0 2px 0 rgba(0, 0, 0, .25); }
.player.active .label, .player.active .sub { color: color-mix(in srgb, var(--on-felt) 72%, transparent); }
.player .head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.player .name { font-weight: 600; font-size: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pips { display: flex; gap: 4px; flex-shrink: 0; }
.pip { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid currentColor; opacity: .55; }
.pip.on { background: var(--red); border-color: var(--red); opacity: 1; }
.setnum { font-family: var(--font-display); font-weight: 700; font-size: 16px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--red); color: #fff; display: inline-grid; place-items: center; line-height: 1; }
.player .rem { font-size: clamp(64px, 11vw, 96px); line-height: .95; font-weight: 700; letter-spacing: -.01em; }
.player .route { font-family: var(--font-display); font-weight: 600; font-size: 16px; letter-spacing: .03em; min-height: 26px; color: var(--muted); display: flex; gap: 4px; flex-wrap: wrap; align-items: center; }
.player.active .route { color: var(--on-felt); }
.player .sub { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.player .sub b { font-family: var(--font-display); font-size: 16px; font-weight: 600; color: inherit; }
.player.active .sub b { color: var(--on-felt); }
.thinking { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }
.thinking::after { content: ""; display: inline-block; width: 6px; height: 6px; margin-left: 6px; border-radius: 50%; background: var(--red); animation: blink 1s infinite; vertical-align: middle; }
@keyframes blink { 50% { opacity: .15; } }

/* Input */
.entry { display: grid; gap: 12px; }
.readout {
  display: flex; align-items: center; justify-content: space-between; gap: 12px; border: 1px solid var(--line);
  background: var(--surface-2); border-radius: 12px; padding: 6px 16px; min-height: 70px; box-shadow: inset 0 2px 6px rgba(0, 0, 0, .08);
}
.readout .val { font-size: 52px; font-weight: 700; line-height: 1; }
.readout .val.empty { color: var(--muted); font-size: 22px; font-weight: 500; font-family: var(--font-body); }
.readout .who { text-align: right; font-size: 13px; color: var(--muted); }
.msg { min-height: 20px; font-size: 13.5px; color: var(--red); font-weight: 500; }
.quick { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.chip {
  border: 1px solid var(--line); background: var(--surface-2); border-radius: 999px; padding: 7px 4px;
  font-family: var(--font-display); font-size: 19px; font-weight: 600; font-variant-numeric: tabular-nums; transition: border-color .15s, background .15s;
}
.chip:hover:not(:disabled) { border-color: var(--muted); background: var(--surface); }
.chip.co { background: linear-gradient(180deg, color-mix(in srgb, var(--green) 85%, #fff), var(--green)); color: #fff; border-color: var(--green); font-size: 16px; }
.chip.zero { font-size: 15px; }
.keys { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.key {
  border: 1px solid var(--line); background: linear-gradient(180deg, var(--surface), var(--surface-2)); border-radius: 12px; padding: 12px 0;
  font-family: var(--font-display); font-size: 30px; font-weight: 600; box-shadow: inset 0 -3px 0 var(--line), 0 1px 2px rgba(0, 0, 0, .06);
  transition: transform .06s, box-shadow .06s;
}
.key:hover:not(:disabled) { background: var(--surface-2); }
.key:active:not(:disabled) { transform: translateY(2px); box-shadow: inset 0 -1px 0 var(--line); }
.key.ok {
  background: linear-gradient(180deg, var(--red), var(--red-2)); color: #fff; border-color: var(--red-2); font-size: 22px; letter-spacing: .08em; text-transform: uppercase;
  box-shadow: inset 0 -3px 0 rgba(0, 0, 0, .25), 0 6px 16px -8px var(--red);
}
.key.fn { font-size: 18px; color: var(--muted); }
button:disabled { opacity: .45; cursor: not-allowed; }
.row-actions { display: flex; gap: 8px; justify-content: space-between; flex-wrap: wrap; align-items: center; }
.hint { font-size: 12.5px; color: var(--muted); }
kbd { font-family: var(--font-body); font-size: 11.5px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; }

/* Board */
.board-panel {
  display: grid; gap: 12px; justify-items: center;
  background: radial-gradient(closest-side at 50% 52%, var(--spot), transparent 100%) no-repeat center / 115% 92%, var(--wall);
}
.board-panel .cap { width: 100%; display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; align-items: baseline; }
.cap-route { font-family: var(--font-display); font-weight: 600; font-size: 18px; letter-spacing: .03em; }
svg.board { width: 100%; max-width: 380px; height: auto; display: block; filter: drop-shadow(0 18px 26px rgba(0, 0, 0, .35)); }
svg.board .seg { stroke: var(--board-wire); stroke-width: .7; transition: opacity .25s; }
svg.board.focus .seg:not(.hl) { opacity: .28; }
svg.board .seg.hl { stroke: #fff; stroke-width: 2.2; }
svg.board .n { fill: #f3e9cc; font-family: var(--font-display); font-weight: 600; font-size: 18px; text-anchor: middle; dominant-baseline: central; }
svg.board .dart { animation: land .35s ease-out both; }
@keyframes land { from { opacity: 0; transform: scale(2.2); } to { opacity: 1; transform: scale(1); } }
.darts-legend { display: flex; gap: 10px; flex-wrap: wrap; font-size: 13px; color: var(--muted); width: 100%; }
.darts-legend b { color: var(--ink); font-family: var(--font-display); font-size: 16px; }

/* Chalk sheet */
.sheet-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th, td { padding: 5px 8px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-size: 11.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
th:first-child, td:first-child { text-align: left; }
.sheet td.sc { font-family: var(--font-display); font-size: 18px; font-weight: 600; }
.sheet td.lf { font-family: var(--font-display); font-size: 18px; color: var(--muted); }
.sheet td.bust { color: var(--red); }
.sheet td.out { color: var(--green); }
.sheet tr td.rnd { color: var(--muted); font-size: 12px; }
.sheet .sep { border-left: 1px solid var(--line); }
.stats td { font-family: var(--font-display); font-size: 18px; font-weight: 600; }
.stats td:first-child { font-family: var(--font-body); font-size: 14px; font-weight: 500; color: var(--muted); }
.stats td.best { color: var(--green); }
h2 { font-family: var(--font-display); font-size: 20px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; margin: 0 0 10px; text-wrap: balance; }
.h2row { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.h2row h2 { margin-bottom: 10px; }

/* Overlays */
.overlay {
  position: fixed; inset: 0; background: color-mix(in srgb, var(--ink) 45%, transparent); display: grid; place-items: center;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  z-index: 20;
}
.dialog { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 20px; width: min(440px, 100%); display: grid; gap: 16px; max-height: 100%; overflow-y: auto; }
.dialog h3 { margin: 0; font-family: var(--font-display); font-size: 24px; text-transform: uppercase; letter-spacing: .03em; }
.dialog p { margin: 0; color: var(--muted); }
.opts { display: flex; gap: 6px; flex-wrap: wrap; }
.opt { border: 1px solid var(--line); background: var(--surface-2); border-radius: 7px; padding: 8px 14px; font-weight: 600; min-width: 46px; }
.opt[aria-pressed="true"] { background: var(--ink); color: var(--on-ink); border-color: var(--ink); }
.field { display: grid; gap: 6px; }
.field input[type=text], .field input[type=number], .field select { font: inherit; padding: 8px 10px; border-radius: 7px; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); width: 100%; }
.field input[type=range] { width: 100%; accent-color: var(--red); }
.dialog .actions { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
.toast {
  position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
  background: var(--ink); color: var(--on-ink); padding: 10px 16px; border-radius: 8px; font-weight: 600; z-index: 30;
  max-width: calc(100% - 32px); text-align: center;
}
.winner { border: 2px solid var(--green); }
.winner h2 { color: var(--green); }
.shake { animation: shake .3s; }
@keyframes shake { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
/* Training games */
.ghud { display: grid; gap: 6px; }
.gtarget { font-size: clamp(72px, 14vw, 120px); line-height: .9; font-weight: 700; }
.gsub { color: var(--muted); font-size: 14px; }
.gstats { display: flex; gap: 22px; flex-wrap: wrap; margin-top: 6px; }
.gstats div { display: grid; }
.gstats b { font-size: 26px; font-weight: 600; }
.gpadwrap { display: grid; gap: 10px; }
.gpad { display: grid; gap: 8px; grid-template-columns: repeat(var(--cols, 4), minmax(0, 1fr)); }
.gbtn {
  border: 1px solid var(--line); background: var(--surface-2); border-radius: 8px; padding: 14px 6px;
  font-family: var(--font-display); font-size: 24px; font-weight: 600; display: grid; justify-items: center; gap: 2px;
}
.gbtn:hover:not(:disabled) { border-color: var(--muted); }
.gbtn kbd { font-size: 10.5px; color: var(--muted); font-weight: 500; }
.gbtn.good { background: var(--green); border-color: var(--green); color: #fff; }
.gbtn.good kbd { color: inherit; border-color: currentColor; opacity: .85; }
.gbtn small { font-family: var(--font-body); font-size: 11.5px; color: var(--muted); font-weight: 500; }
.gbtn.good small { color: inherit; opacity: .85; }
.cells { display: grid; grid-template-columns: repeat(auto-fill, minmax(50px, 1fr)); gap: 6px; }
.cell { border: 1px solid var(--line); border-radius: 7px; padding: 4px 6px; display: grid; text-align: center; min-height: 52px; align-content: center; }
.cell span { font-size: 11.5px; color: var(--muted); font-weight: 600; }
.cell b { font-size: 20px; font-weight: 600; min-height: 24px; }
.cell.now { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.cell.ok b { color: var(--green); }
.cell.bad b { color: var(--red); }
.rules { margin: 0; color: var(--muted); max-width: 62ch; }
.crtab th, .crtab td, .crtab th:first-child, .crtab td:first-child { text-align: center; }
.crtab td { padding: 3px 6px; }
.crtab td.crnum { font-family: var(--font-display); font-size: 24px; font-weight: 700; width: 64px; }
.crtab tr.closed td { opacity: .3; }
.crtab .mk svg { width: 26px; height: 26px; display: block; margin: 0 auto; }
.crtab th { text-transform: none; letter-spacing: 0; font-size: 14px; color: var(--ink); width: 42%; }
.crtab th b { display: block; font-family: var(--font-display); font-size: 40px; line-height: 1.1; }
.crtab th .hint { display: block; font-weight: 500; }
.crtab th.on { color: var(--red); }
.crpad { display: grid; grid-template-columns: 44px repeat(3, minmax(0, 1fr)); gap: 6px; align-items: center; }
.crpad .crn { font-family: var(--font-display); font-size: 22px; font-weight: 700; text-align: center; }
.crpad .gbtn { padding: 8px 4px; font-size: 19px; }
.visit-chips { display: flex; gap: 6px; flex-wrap: wrap; }
.vchip { border: 1px dashed var(--line); border-radius: 6px; padding: 3px 10px; font-family: var(--font-display); font-size: 18px; min-width: 60px; text-align: center; color: var(--muted); }
.vchip.set { border-style: solid; color: var(--ink); }
/* Menu */
.menu { display: grid; gap: 24px; }
.cards { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(min(240px, 100%), 1fr)); }
.gcard {
  text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius);
  padding: 16px; display: grid; gap: 6px; align-content: start; transition: border-color .15s, transform .15s;
}
.gcard:hover { border-color: var(--ink); transform: translateY(-1px); }
.gcard .gname { font-family: var(--font-display); font-size: 26px; font-weight: 700; text-transform: uppercase; letter-spacing: .02em; line-height: 1; }
.gcard .gdesc { color: var(--muted); font-size: 14px; }
.gcard .gmeta { display: flex; gap: 12px; flex-wrap: wrap; font-size: 11.5px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); margin-top: 4px; }
.gcard .gmeta .pb { color: var(--green); }
.resume { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.resume b { display: block; font-size: 18px; margin-top: 2px; }
/* Multi-player scoreboard */
.mplayers { display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); margin-top: 6px; }
.mp { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; display: grid; gap: 2px; min-width: 0; }
.mp.on { background: var(--ink); color: var(--on-ink); border-color: var(--ink); }
.mp.on .label, .mp.on .mps { color: color-mix(in srgb, var(--on-ink) 70%, transparent); }
.mp .mpn { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mp b { font-size: 40px; line-height: 1.05; font-weight: 700; color: inherit; }
.mp .mps { font-size: 13px; color: var(--muted); }
.mp.out { opacity: .45; }
.gtarget.long { font-size: clamp(44px, 8vw, 72px); }
.chip.wide { grid-column: span 2; }
.sheet.tally td { font-family: var(--font-display); font-size: 18px; }
.sheet.tally td:first-child { font-family: var(--font-body); font-size: 14px; color: var(--muted); }
.sheet.tally tr.nowrow td { background: var(--surface-2); }
.sheet.tally tr.tot td { font-weight: 700; border-top: 2px solid var(--ink); }
.sheet td.bust { color: var(--red); }
/* Setup player list */
.plist { display: grid; gap: 8px; }
.prow { display: grid; gap: 6px; padding: 10px; border: 1px solid var(--line); border-radius: 8px; }
.prow-top { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.prow-top input[type=text] { flex: 1 1 140px; width: auto; min-width: 0; }
.prow input[type=range] { width: 100%; accent-color: var(--red); }
/* ===== Design pass ===== */
/* Route chips: one per dart, coloured like the ring it aims at */
.rchip { display: inline-flex; align-items: center; padding: 1px 8px; border-radius: 999px; font-family: var(--font-display); font-weight: 700; font-size: 15px; letter-spacing: .03em; border: 1px solid transparent; line-height: 1.4; }
.rchip.r-T { background: var(--board-red); color: #fff; }
.rchip.r-D { background: var(--board-green); color: #fff; }
.rchip.r-S { background: var(--board-cream); color: #1b1d1c; }
.rchip.r-SB { background: var(--board-green); color: #fff; }
.rchip.r-DB { background: var(--board-red); color: #fff; }
.cap-route { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
.cap-route .rchip { font-size: 17px; }

/* Menu */

<script id="engine">
// ===== Darts engine: board geometry, checkout routes, bot throwing, stats =====
const E = (() => {
  const ORDER = [20, 1, 18, 4, 13, 6, 10, 15, 2, 17, 3, 19, 7, 16, 8, 11, 14, 9, 12, 5];
  const SEGS = [], BY = {};
  for (let n = 1; n <= 20; n++) {
    for (const [ring, m] of [['S', 1], ['D', 2], ['T', 3]]) {
      const s = { k: ring + n, n, ring, v: n * m, dbl: ring === 'D' };
      SEGS.push(s); BY[s.k] = s;
    }
  }
  BY['25'] = { k: '25', n: 25, ring: 'SB', v: 25, dbl: false };
  BY.BULL = { k: 'BULL', n: 25, ring: 'DB', v: 50, dbl: true };
  SEGS.push(BY['25'], BY.BULL);
  const MISS = { k: 'MISS', n: 0, ring: 'X', v: 0, dbl: false };
  BY.MISS = MISS;

  // Board dimensions in mm (regulation board)
  const R = { bull: 6.35, outerBull: 15.9, trebleIn: 99, trebleOut: 107, doubleIn: 162, doubleOut: 170 };

  const IMPOSSIBLE = new Set([163, 166, 169, 172, 173, 175, 176, 178, 179]);
  const validVisit = s => Number.isInteger(s) && s >= 0 && s <= 180 && !IMPOSSIBLE.has(s);
  const label = s => s.k === 'BULL' ? 'Bull' : s.k === 'MISS' ? 'Miss' : s.k;

  // Route preferences: favourite doubles first, big trebles for set-up, singles are big targets
  const DBL_COST = { 16: 0, 20: 0.05, 8: 0.2, 18: 0.3, 12: 0.35, 10: 0.45, 14: 0.5, 4: 0.55, 6: 0.6, 2: 0.7, 1: 1.3 };
  const TRE_COST = { 20: 0, 19: 0.1, 18: 0.2, 17: 0.3, 16: 0.35 };
  // Which darts can finish a leg: anything (single out), a double (double out), or a double or treble (master out)
  const isFinisher = (s, out) => out === 'single' || s.dbl || (out === 'master' && s.ring === 'T');
  function finishCost(s, out, style) {
    if (out !== 'single') {
      if (!isFinisher(s, out)) return null;
      if (style && s.k === 'BULL' && style.bullShy) return 2.5;
      if (style && s.n === style.fav && s.ring === 'D') return -0.1;
      if (s.ring === 'T') return 0.15 + (TRE_COST[s.n] ?? 0.6);
      return s.k === 'BULL' ? 1.0 : (DBL_COST[s.n] ?? 0.8);
    }
    return s.ring === 'S' ? 0 : s.ring === 'T' ? 0.3 : s.ring === 'D' ? 0.5 : s.k === 'BULL' ? 0.9 : 0.6;
  }
  function setupCost(s, style) {
    if (style && style.bullShy && (s.k === '25' || s.k === 'BULL')) return 1.6;
    if (s.ring === 'T') return TRE_COST[s.n] ?? 0.6;
    if (s.ring === 'S') return 0.15 + (s.n < 5 ? 0.05 : 0);
    if (s.k === '25') return 0.5;
    if (s.k === 'BULL') return 0.9;
    return 1.5;
  }

  const memo = new Map();
  function exactRoute(r, n, out, style) {
    let best = null, bc = Infinity;
    const rec = (rem, left, path, cost) => {
      if (cost >= bc) return;
      if (left === 1) {
        for (const s of SEGS) if (s.v === rem) {
          const fc = finishCost(s, out, style);
          if (fc != null && cost + fc < bc) { bc = cost + fc; best = [...path, s]; }
        }
        return;
      }
      for (const s of SEGS) {
        if (s.v >= rem) continue;
        const nx = rem - s.v;
        if (out !== 'single' && nx < 2) continue;
        rec(nx, left - 1, [...path, s], cost + setupCost(s, style));
      }
    };
    rec(r, n, [], 0);
    return best;
  }
  // Fewest darts first, then the most comfortable route
  // style (optional): a player's habits, { fav: favourite double, bullShy: avoids the bull }
  function bestRoute(r, darts = 3, out = 'double', style = null, minLen = 1) {
    if (r <= 0 || r > 180) return null;
    if (out === 'double' && r > 170) return null;
    const key = r + '|' + darts + '|' + out + '|' + (style ? style.fav + (style.bullShy ? 'b' : '') : '') + '|' + minLen;
    if (memo.has(key)) return memo.get(key);
    let res = null;
    for (let n = minLen; n <= darts && !res; n++) res = exactRoute(r, n, out, style);
    if (res && res.length > 2) res = [...res.slice(0, -1).sort((a, b) => setupCost(a, style) - setupCost(b, style)), res[res.length - 1]];
    memo.set(key, res);
    return res;
  }
  const minDarts = (r, out, style = null) => { const rt = bestRoute(r, 3, out, style); return rt ? rt.length : Infinity; };

  // ---- Bot ----
  function aimPoint(s) {
    if (s.k === 'BULL') return [0, 0];
    if (s.k === '25') return [0, 11];
    const t = ORDER.indexOf(s.n) * 18 * Math.PI / 180;
    const r = { T: 103, D: 166, S: 134 }[s.ring];
    return [r * Math.sin(t), r * Math.cos(t)];
  }
  function hitAt(x, y) {
    const r = Math.hypot(x, y);
    if (r <= R.bull) return BY.BULL;
    if (r <= R.outerBull) return BY['25'];
    if (r > R.doubleOut) return MISS;
    const deg = (Math.atan2(x, y) * 180 / Math.PI + 369) % 360;
    const n = ORDER[Math.floor(deg / 18) % 20];
    const ring = r >= R.doubleIn ? 'D' : (r >= R.trebleIn && r <= R.trebleOut) ? 'T' : 'S';
    return BY[ring + n];
  }
  const BOGEY = new Set([169, 168, 166, 165, 163, 162, 159]);
  const GOOD_LEAVES = [32, 40, 36, 16, 24, 20, 8, 12, 28, 18, 10, 4];
  const SETUP_CANDIDATES = [...Array.from({ length: 20 }, (_, i) => BY['S' + (i + 1)]), BY['25'], BY.T20, BY.T19, BY.T18, BY.T17, BY.T16];
  function gauss() {
    let u = 0, v = 0;
    while (u === 0) u = Math.random();
    while (v === 0) v = Math.random();
    return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
  }

  // ---- How the bot thinks ----
  // Every bot gets habits for the match, as real players have: a favourite double (most go for
  // 16 or 20), a scoring bed (a few are "19 shooters"), and weaker players shy away from the bull.
  // "form" carries over from visit to visit, so bots have hot and cold patches.
  function makePersona(avg) {
    const r = Math.random();
    const fav = r < 0.4 ? 16 : r < 0.75 ? 20 : r < 0.85 ? 8 : r < 0.93 ? 18 : 12;
    return { avg, fav, bed: Math.random() < 0.12 ? 19 : 20, bullShy: avg < 70, form: 0, pressure: 1 };
  }
  const styleOf = ctx => ctx ? { fav: ctx.fav, bullShy: ctx.bullShy } : null;

  // With no finish on, pick the dart that leaves the best next visit: fewest darts to finish, then a
  // favourite leave. Trebles count against weaker players, who prefer the big single.
  function setupDart(rem, out, ctx) {
    const fav = ctx?.fav ?? 16, avg = ctx?.avg ?? 70, style = styleOf(ctx);
    const leaves = [2 * fav, ...GOOD_LEAVES.filter(l => l !== 2 * fav)];
    const trebleCost = avg >= 80 ? 1 : avg >= 55 ? 5 : 20;
    let best = BY.T20, bs = Infinity;
    for (const s of SETUP_CANDIDATES) {
      const leave = rem - s.v;
      if (leave < 2) continue;
      const md = minDarts(leave, out, style);
      const rank = leaves.indexOf(leave);
      const sc = (md === Infinity ? 40 + leave / 10 : md * 10) + (rank >= 0 ? rank : 12)
        + (s.ring === 'T' ? trebleCost : s.k === '25' ? (ctx?.bullShy ? 8 : 3) : (20 - s.n) * 0.01);
      if (sc < bs) { bs = sc; best = s; }
    }
    return best;
  }
  // blocked(seg) says whether darts already in the board cover that target.
  function chooseTarget(rem, dartsLeft, out, ctx = null, blocked = () => false) {
    const style = styleOf(ctx);
    let route = bestRoute(rem, dartsLeft, out, style);
    // A bull-shy player with two or three darts on 50 plays S10 D20 rather than the bull
    if (route && style?.bullShy && route.length === 1 && route[0].k === 'BULL') route = dartsLeft > 1 ? bestRoute(rem, dartsLeft, out, style, 2) : null;
    if (route) return route[0];
    if (out === 'single') return rem >= 60 ? BY.T20 : (SEGS.filter(s => s.ring === 'S' && s.v <= rem).pop() || BY.S1);
    if (rem > 130) {
      // Scoring: own bed, avoid leaving a bogey number, switch beds when the treble is blocked
      const bed = ctx?.bed ?? 20, alt = bed === 20 ? 19 : 20;
      let t = BY['T' + bed];
      if (BOGEY.has(rem - t.v) && !BOGEY.has(rem - 57)) t = BY.T19;
      // Better players sometimes switch when two darts crowd the treble; weaker ones keep throwing at it
      if (blocked(t) && (ctx?.avg ?? 70) >= 60 && Math.random() < 0.5) t = blocked(BY['T' + alt]) ? BY.T18 : BY['T' + alt];
      return t;
    }
    return setupDart(rem, out, ctx);
  }

  // ---- How the bot throws ----
  // Each dart lands with Gaussian scatter around the aim point, much more up-and-down (release
  // timing) than side-to-side (alignment), so darts at T20 stay in the 20, 1 and 5 beds; now and
  // then a dart drifts wide, less often with skill. Part of the scatter is shared by the three darts of
  // a visit (stance and rhythm), so darts group: good visits are tighter and bad ones are all off.
  // Most darts are tight, but about one in seven comes out loose with double the scatter.
  // Darts already in the board can deflect a dart or knock it out, and a dart that lands on a wire
  // can bounce out. Darts at a finishing double get extra scatter (the "dbl" factor), large for weak
  // players and nearly gone for strong ones, raised a little more under pressure.
  // CAL maps a target 3-dart average to [scatter mm, double factor], fitted by simulating full 501
  // double-out legs so each average comes with a realistic checkout %.
  const CAL = [[20,31.08,1.722], [25,25.25,1.863], [30,22.2,1.747], [35,19.92,1.76], [40,18.58,1.644], [45,16.73,1.554], [50,14.94,1.502], [55,13.2,1.612], [60,12.03,1.49], [65,10.09,1.676], [70,8.95,1.747], [75,7.6,1.941], [80,6.95,1.838], [85,6.14,1.967], [90,5.76,1.812], [95,5.14,1.928], [100,4.67,1.883], [105,4.05,2.334], [110,3.52,2.572], [115,3.07,2.908], [120,2.76,3.159]];
  const GROUP = 0.62;
  const AVG_MIN = CAL[0][0], AVG_MAX = CAL[CAL.length - 1][0];
  // Typical checkout % (doubles hit / darts at double) by 3-dart average, from amateur to pro
  const CO_CURVE = [[20, 3.8], [30, 6.5], [40, 10], [50, 14], [60, 18.5], [70, 23.5], [80, 29.5], [90, 37], [100, 43], [110, 46], [120, 48]];
  const lerpCurve = (curve, x) => {
    if (x <= curve[0][0]) return curve[0][1];
    for (let i = 1; i < curve.length; i++) if (x <= curve[i][0]) {
      const [x0, y0] = curve[i - 1], [x1, y1] = curve[i];
      return y0 + (y1 - y0) * (x - x0) / (x1 - x0);
    }
    return curve[curve.length - 1][1];
  };
  // Share of darts that drift sideways badly, falling with skill
  const wideFor = avg => 0.12 - 0.11 * (Math.max(20, Math.min(120, avg)) - 20) / 100;
  // Extra double scatter when the opponent is on a finish or it's a match dart; weak players feel it most
  const pressureFor = avg => 1 + 0.15 * Math.max(0, Math.min(1, (75 - avg) / 55));
  // Players are sharpest on their own scoring bed (most practise T20 for hours). Other numbers and
  // the bull get this extra scatter: a lot for club players, little for pros. Set so Cricket marks
  // per round match league players of each average (about 1.6 MPR at 40, 2.3 at 60, 3.0 at 80).
  const OFF = [[20, 1.85], [40, 1.8], [60, 1.85], [75, 1.8], [90, 1.45], [100, 1.3], [120, 1.15]];
  function profileFor(avg) {
    const a = Math.max(AVG_MIN, Math.min(AVG_MAX, +avg || 50));
    let i = 0;
    while (i < CAL.length - 2 && CAL[i + 1][0] < a) i++;
    const [a0, s0, k0] = CAL[i], [a1, s1, k1] = CAL[i + 1], t = (a - a0) / (a1 - a0);
    return { avg: a, sigma: Math.exp(Math.log(s0) + t * (Math.log(s1) - Math.log(s0))), dbl: k0 + t * (k1 - k0), wide: wideFor(a), off: lerpCurve(OFF, a), co: lerpCurve(CO_CURVE, a) };
  }

  const WIRE_RADII = [R.bull, R.outerBull, R.trebleIn, R.trebleOut, R.doubleIn, R.doubleOut];
  function nearWire(x, y) {
    const r = Math.hypot(x, y);
    if (WIRE_RADII.some(w => Math.abs(r - w) < 0.6)) return true;
    if (r < R.outerBull || r > R.doubleOut) return false;
    const off = ((Math.atan2(x, y) * 180 / Math.PI + 369) % 360) % 18;
    return r * Math.sin(Math.min(off, 18 - off) * Math.PI / 180) < 0.6;
  }
  // Start a visit: returns throwDart(target, atDouble) plus blocked(target) for aiming decisions
  // Scatter multiplier for one dart: doubles have their own nerves; other numbers are off the bed;
  // pressure tightens the arm a little on every dart and more on doubles.
  function aimFactor(t, prof, ctx, atDouble) {
    const pr = ctx?.pressure || 1;
    if (atDouble) return (prof.dbl || 1) * pr;
    const onBed = t.n === (ctx?.bed ?? 20) || t.k === 'MISS';
    return (onBed ? 1 : (prof.off || 1)) * (1 + (pr - 1) * 0.5);
  }
  function startVisit(prof, ctx = {}) {
    ctx.form = 0.85 * (ctx.form || 0) + gauss() * 0.06;
    const s = prof.sigma * Math.exp(ctx.form);
    const ox = gauss() * s * GROUP * 0.6, oy = gauss() * s * GROUP * 1.35;
    const own = Math.sqrt(1 - GROUP * GROUP);
    const landed = [];
    const throwDart = (t, atDouble = false) => {
      const k = aimFactor(t, prof, ctx, atDouble);
      const [ax, ay] = aimPoint(t);
      const side = Math.random() < (prof.wide || 0) ? 1.4 : 0.6;
      // Most darts are tight; now and then one comes out loose
      const loose = Math.random() < 0.15 ? 2 : 0.82;
      let x = ax + ox + gauss() * s * own * k * side * loose, y = ay + oy + gauss() * s * own * k * 1.35 * loose;
      let event = null;
      for (const d of landed) {
        if (Math.hypot(x - d.x, y - d.y) < 2) {
          const u = Math.random();
          if (u < 0.08) event = 'bounce';
          else if (u < 0.45) { const a = Math.random() * 2 * Math.PI, m = 3 + Math.random() * 4; x += Math.cos(a) * m; y += Math.sin(a) * m; event = 'deflect'; }
          break;
        }
      }

function shDart(g, mult, extra = {}) {

    else if (o.variant === 'treble' && !set.has(3)) { me.score = 0; me.resets++; }
    me.rounds[g.round - 1] = sumOf(g.cur.map(d => d.mult)) * g.round;
    g.log.push({ p: g.turn, round: g.round, darts: g.cur });
    g.cur = [];
    if (g.winner != null) return;
    nextTurn(g);
    if (g.round > o.rounds) { g.round = o.rounds; settleByScore(g, p => p.score); }
  }
}

  c121: {

    rules: 'Check out the target on a double within the darts allowed. Make it and the next target goes up. Miss it and you drop back to your safehouse: the last target you protected, or the start. When a score gets protected depends on the safehouse setting; by default, checking out in one visit protects it. Your highest checkout is the score.',
    hint: 'Type each visit total, then Enter. Busts count as no score. Ctrl+Z undoes.',
    init(st) {
      const o = resolveOpts(st);
      return { o, target: o.start, rem: o.start, visit: 0, results: [], high: 0, safe: o.start, streak: 0, ended: false };
    },
    done: g => g.ended || (g.o.rounds > 0 && g.results.length >= g.o.rounds),
    validate(g, v) {
      if (!E.validVisit(v)) return v > 180 ? 'The most three darts can score is 180.' : `${v} can't be scored with three darts.`;
      if (v === g.rem && E.minDarts(g.rem, 'double') > 3) return `${g.rem} can't be checked out on a double in three darts.`;
      return null;
    },
    act(g, a, v) {
      if (a === 'end') { g.ended = true; return; }
      const s = +v, o = g.o, maxVisits = o.darts / 3;
      if (!(s > g.rem || g.rem - s === 1)) g.rem -= s;
      let ok = null;
      const visits = g.visit + 1;
      if (g.rem === 0) ok = true; else if (++g.visit >= maxVisits) ok = false;
      if (ok == null) return;
      g.results.push({ t: g.target, ok, visits: ok ? visits : maxVisits });
      if (ok) {
        g.high = Math.max(g.high, g.target);
        g.streak++;
        const protect = { start: false, 3: visits <= 1, 6: visits <= 2, row3: g.streak >= 3, row5: g.streak >= 5, each: true }[o.safe];
        if (protect) g.safe = g.target;
        g.target += o.step;

      }

    },
    board(g) {

    },
    result: g => ({ headline: g.high ? `Highest checkout: ${g.high}` : 'No checkouts this time', detail: `${g.results.filter(r => r.ok).length} of ${g.results.length} attempts checked out.`, best: g.high || null, better: 'max' }),
  },

        sub: `3-dart average · ${R ? `${(R - g.visits.length) * 3} darts left · ` : ''}${tot} scored`,

    pad: g => keypadHTML({ chips: [[0, 'No score', 'zero'], ...[26, 41, 45, 60, 81, 85, 100, 140, 180].map(q => [q, q])], aim: 'T20' }) + (g.o.rounds ? '' : endBtn()),
    board: () => ({ label: 'Suggested target', text: 'T20', keys: ['T20'] }),
    log: g => { const R = g.o.rounds || Math.max(10, g.visits.length + 1); return `<section class="panel"><h2>Visits</h2>${cellsHTML(Array.from({ length: R }, (_, i) => ({ h: (i + 1) * 3, v: g.visits[i] ?? '', cls: g.visits[i] >= 100 ? 'ok' : '' })), g.visits.length)}</section>`; },

// Player counts per game: [min, max]
const PLAYER_LIMITS = { x01: [1, 4], cricket: [2, 2], killer: [2, 6], shanghai: [1, 6], halveit: [1, 6], atc: [1, 4], bobs27: [1, 4] };

<script>
// ===== App =====
const $ = id => document.getElementById(id);
const STORE_KEY = 'oche-match-v1';
const DEFAULT_SETTINGS = {
  mode: 'x01', start: 501, inRule: 'straight', out: 'double',
  unit: 'legs', kind: 'firstTo', count: 3, setLegs: 3, twoClear: false, first: 'p1',
  players: [{ name: 'You', type: 'human' }, { name: 'Bot', type: 'bot', avg: 50 }],
};
// Fill in X01 options missing from older saves
function normX01(st) {
  if (st.count == null) st.count = st.legs || 3;
  delete st.legs;
  for (const k of ['start', 'inRule', 'out', 'unit', 'kind', 'setLegs', 'twoClear', 'first']) if (st[k] == null) st[k] = DEFAULT_SETTINGS[k];
  return st;
}
const RULE_NAME = { straight: 'Straight', double: 'Double', master: 'Master' };
// Visit totals a player can score on the visit they open with double/master in
const OPEN_SETS = (() => {
  const any = [0, ...E.SEGS.map(x => x.v)];
  const make = rule => {
    const openers = E.SEGS.filter(x => x.dbl || (rule === 'master' && x.ring === 'T')).map(x => x.v);
    const set = new Set([0]);
    for (const o of openers) for (const a of any) for (const b of any) set.add(o + a + b);
    return set;
  };
  return { double: make('double'), master: make('master') };
})();
let S;
let buffer = '';
let botTimer = null;
let botBusy = false;
let botToken = 0;      // bumped to cancel a bot visit in progress
let botReveal = null;  // darts of the X01 bot visit being thrown right now

const clone = o => JSON.parse(JSON.stringify(o));
function freshMatch(settings) {
  const s = clone(settings);
  s.mode = s.mode || 'x01';
  if (s.mode === 'x01') normX01(s);
  const first = s.first === 'random' ? Math.floor(Math.random() * s.players.length) : 0;
  const m = { settings: s, legs: [{ starter: first, visits: [], winner: null }], matchWinner: null, hist: [], screen: 'play', bots: {}, firstThrower: first };
  if (s.mode !== 'x01') { m.game = GAMES[s.mode].init(s); m.game.bk = bestKey(s); }
  return m;
}
const isGame = () => S.settings.mode !== 'x01';
// Each bot's habits and running form for this match (favourite double, scoring bed, …)
function botCtx(p) {
  S.bots = S.bots || {};
  if (!S.bots[p]) S.bots[p] = E.makePersona(botAvg(players()[p]));
  return S.bots[p];
}
function cancelBot() { clearTimeout(botTimer); botToken++; botReveal = null; }
const players = () => S.settings.players;
const n = () => players().length;
const curLeg = () => S.legs[S.legs.length - 1];
const turnOf = leg => (leg.starter + leg.visits.length) % n();
const remaining = (leg, p) => S.settings.start - leg.visits.filter(v => v.p === p).reduce((a, v) => a + v.score, 0);
const legsWon = p => S.legs.filter(l => l.winner === p).length;
// Has this player opened the leg yet (always true with straight in)? A visit with points means they have.
const opened = (leg, p) => (S.settings.inRule || 'straight') === 'straight' || leg.visits.some(v => v.p === p && v.score > 0);
const needOf = (count, kind) => kind === 'bestOf' ? Math.floor(count / 2) + 1 : count;
// Winner of a race to `need` (with an optional two-clear rule), or -1
function raceWinner(counts, need, twoClear) {
  for (let p = 0; p < counts.length; p++) {
    const best = Math.max(0, ...counts.filter((_, q) => q !== p));
    if (counts[p] >= need && (!twoClear || counts[p] - best >= 2)) return p;
  }
  return -1;
}
// Sets and legs so far, worked out from the finished legs
function standings() {
  const st = S.settings, N = n();
  const sets = Array(N).fill(0), total = Array(N).fill(0);
  let setLegs = Array(N).fill(0), setsDone = 0;
  for (const leg of S.legs) {
    if (leg.winner == null) continue;
    total[leg.winner]++;
    if (st.unit === 'sets') {
      setLegs[leg.winner]++;
      const w = raceWinner(setLegs, st.setLegs, st.twoClear);
      if (w >= 0) { sets[w]++; setsDone++; setLegs = Array(N).fill(0); }
    }
  }
  const legs = st.unit === 'sets' ? setLegs : total;
  const matchWinner = st.unit === 'sets' ? raceWinner(sets, needOf(st.count, st.kind), false) : raceWinner(total, needOf(st.count, st.kind), st.twoClear);
  return { sets, legs, total, setsDone, legsInSet: setLegs.reduce((a, b) => a + b, 0), matchWinner };
}
// Would winning the current leg win the match for player p?
function legWinsMatch(p) {
  const leg = curLeg(), w = leg.winner;
  leg.winner = p;
  const r = standings().matchWinner === p;
  leg.winner = w;
  return r;
}
// Who throws first in the next leg: the set's starter alternates, and legs alternate within a set
function nextStarter() {
  const st = S.settings, s = standings(), first = S.firstThrower || 0;
  const k = st.unit === 'sets' ? s.setsDone + s.legsInSet : s.total.reduce((a, b) => a + b, 0);
  return (first + k) % n();
}
function formatText(st) {
  const unit = st.unit === 'sets' ? 'set' : 'leg';
  const head = st.kind === 'bestOf' ? `Best of ${st.count} ${unit}s` : `First to ${st.count} ${unit}${st.count > 1 ? 's' : ''}`;
  return head + (st.unit === 'sets' ? ` (first to ${st.setLegs} leg${st.setLegs > 1 ? 's' : ''})` : '') + (st.twoClear ? ', two clear' : '');
}
function isBotTurn() {
  if (isGame()) {
    const G = GAMES[S.settings.mode];
    return !!G.botVisit && !G.done(S.game) && players()[S.game.turn]?.type === 'bot';
  }
  return S.matchWinner == null && players()[turnOf(curLeg())].type === 'bot';
}
const fmt = (x, d = 1) => x == null ? '–' : x.toFixed(d);

function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); } catch (e) {} }
function load() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) { const s = JSON.parse(raw); if (s && s.settings && Array.isArray(s.legs) && s.legs.length) return s; }
  } catch (e) {}
  return null;
}

// ---------- board ----------
function buildBoard() {
  const svg = $('board');
  const NS = 'http://www.w3.org/2000/svg';
  const pt = (r, a) => { const t = a * Math.PI / 180; return [(r * Math.sin(t)).toFixed(2), (-r * Math.cos(t)).toFixed(2)]; };
  const sector = (r1, r2, a1, a2) => {
    const [x1, y1] = pt(r2, a1), [x2, y2] = pt(r2, a2), [x3, y3] = pt(r1, a2), [x4, y4] = pt(r1, a1);
    return `M${x1} ${y1}A${r2} ${r2} 0 0 1 ${x2} ${y2}L${x3} ${y3}A${r1} ${r1} 0 0 0 ${x4} ${y4}Z`;
  };
  const el = (tag, attrs) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); return e; };
  svg.innerHTML = `<defs><radialGradient id="shade" cx="50%" cy="45%" r="55%"><stop offset="60%" stop-color="#000" stop-opacity="0"/><stop offset="100%" stop-color="#000" stop-opacity=".28"/></radialGradient>
    <radialGradient id="rim" cx="50%" cy="40%" r="60%"><stop offset="80%" stop-color="#2a2d2c"/><stop offset="100%" stop-color="#0d0e0e"/></radialGradient></defs>`;
  svg.appendChild(el('circle', { cx: 0, cy: 0, r: 199, fill: 'url(#rim)' }));
  svg.appendChild(el('circle', { cx: 0, cy: 0, r: 197.5, fill: 'none', stroke: 'rgba(255,255,255,.12)', 'stroke-width': 1.5 }));
  const R = E.R;
  E.ORDER.forEach((num, i) => {
    const a1 = i * 18 - 9, a2 = i * 18 + 9, even = i % 2 === 0;
    const single = even ? 'var(--board-black)' : 'var(--board-cream)';
    const colour = even ? 'var(--board-red)' : 'var(--board-green)';
    [[R.outerBull, R.trebleIn, 'S', single], [R.trebleIn, R.trebleOut, 'T', colour], [R.trebleOut, R.doubleIn, 'S', single], [R.doubleIn, R.doubleOut, 'D', colour]]
      .forEach(([r1, r2, ring, fill]) => svg.appendChild(el('path', { d: sector(r1, r2, a1, a2), fill, class: 'seg', 'data-k': ring + num })));
    const [tx, ty] = pt(185, i * 18);
    const t = el('text', { x: tx, y: ty, class: 'n' }); t.textContent = num; svg.appendChild(t);
  });
  svg.appendChild(el('circle', { cx: 0, cy: 0, r: R.outerBull, fill: 'var(--board-green)', class: 'seg', 'data-k': '25' }));
  svg.appendChild(el('circle', { cx: 0, cy: 0, r: R.bull, fill: 'var(--board-red)', class: 'seg', 'data-k': 'BULL' }));
  svg.appendChild(el('circle', { cx: 0, cy: 0, r: R.doubleOut, fill: 'url(#shade)', 'pointer-events': 'none' }));
  svg.appendChild(el('circle', { cx: 0, cy: 0, r: R.doubleOut + 0.6, fill: 'none', stroke: '#b9bcb8', 'stroke-width': 1.2, opacity: .7 }));
  const g = el('g', { id: 'dartsLayer' });
  svg.appendChild(g);
}
let drawnDarts = [];
function drawDarts(darts) {
  darts = darts || [];
  const key = d => `${d.x},${d.y}`;
  if (darts.length === drawnDarts.length && darts.every((d, i) => key(d) === key(drawnDarts[i]))) return;
  // Darts already on the board stay put; only new ones land (one after another)
  const keep = darts.length >= drawnDarts.length && drawnDarts.every((d, i) => key(d) === key(darts[i])) ? drawnDarts.length : 0;
  const g = $('dartsLayer');
  if (!keep) g.innerHTML = '';
  darts.slice(keep).forEach((d, j) => {
    const i = keep + j;
    const NS = 'http://www.w3.org/2000/svg';
    const grp = document.createElementNS(NS, 'g');
    grp.setAttribute('class', 'dart');
    grp.setAttribute('style', `animation-delay:${j * 0.45}s;transform-origin:${d.x}px ${-d.y}px`);
    grp.innerHTML = d.bounce
      ? `<circle cx="${d.x}" cy="${-d.y}" r="7" fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="3 2"/><title>Bounce-out</title>`
      : `<circle cx="${d.x}" cy="${-d.y}" r="7" fill="#ffffff" stroke="#111" stroke-width="2"/><text x="${d.x}" y="${-d.y}" font-size="9" font-weight="700" text-anchor="middle" dominant-baseline="central" fill="#111" font-family="Barlow, sans-serif">${i + 1}</text>`;
    g.appendChild(grp);
  });
  drawnDarts = darts.slice();
}
const dartLabel = d => d.bounce ? 'Bounce-out' : E.label(E.BY[d.k]);
function highlight(route) {
  const svg = $('board');
  svg.querySelectorAll('.seg.hl').forEach(e => e.classList.remove('hl'));
  svg.classList.toggle('focus', !!(route && route.length));
  (route || []).forEach(s => svg.querySelectorAll(`[data-k="${s.k}"]`).forEach(e => e.classList.add('hl')));
}

// ---------- rendering ----------
function render() {
  const menu = S.screen === 'menu';
  $('menu').hidden = !menu;
  $('play').hidden = menu;
  $('menuBtn').hidden = $('rematchBtn').hidden = menu;
  if (menu) { $('meta').textContent = 'Pick a game'; return renderMenu(); }
  const game = isGame();
  $('x01Left').hidden = $('x01Right').hidden = game;
  $('gameLeft').hidden = $('gameRight').hidden = !game;
  if (game) return renderGame();
  const st = S.settings, leg = curLeg(), turn = S.matchWinner == null ? turnOf(leg) : -1;
  const sd = standings();
  const where = st.unit === 'sets' ? `Set ${sd.setsDone + 1}, leg ${sd.legsInSet + 1}` : `Leg ${S.legs.length}`;
  $('meta').textContent = `${st.start} · ${st.inRule !== 'straight' ? RULE_NAME[st.inRule] + ' in · ' : ''}${RULE_NAME[st.out === 'single' ? 'straight' : st.out]} out · ${formatText(st)} · ${where}`;
  const stats = E.stats(S.legs, n());

  // scoreboard
  const pe = $('players');
  pe.style.setProperty('--n', n());
  pe.innerHTML = players().map((pl, p) => {
    const rem = remaining(leg, p);
    const route = opened(leg, p) ? E.bestRoute(rem, 3, st.out) : null;
    const mine = leg.visits.filter(v => v.p === p);
    const last = mine[mine.length - 1];
    const legDarts = mine.reduce((a, v) => a + v.dartsUsed, 0);
    const legNeed = st.unit === 'sets' ? st.setLegs : needOf(st.count, st.kind);
    const pips = (st.unit === 'sets' ? `<span class="setnum" title="Sets won">${sd.sets[p]}</span>` : '') +
      (legNeed <= 9 ? Array.from({ length: legNeed }, (_, i) => `<span class="pip${i < sd.legs[p] ? ' on' : ''}"></span>`).join('') : `<span class="setnum" title="Legs won">${sd.legs[p]}</span>`);
    const tag = pl.type === 'bot' ? ` <span class="label" title="Favourite double D${botCtx(p).fav}">${botAvg(pl)} avg · D${botCtx(p).fav}</span>` : '';
    const status = p === turn && pl.type === 'bot' ? `<span class="thinking">Throwing</span>` : '';
    return `<article class="player${p === turn ? ' active' : ''}" aria-current="${p === turn}">
      <div class="head"><span class="name">${esc(pl.name)}${tag}</span><span class="pips" title="${st.unit === 'sets' ? `Sets ${sd.sets[p]}, legs this set ${sd.legs[p]}` : `Legs won: ${sd.legs[p]}`}">${pips}</span></div>
      <div class="rem num">${rem}</div>
      <div class="route">${route ? routeChips(route) : !opened(leg, p) ? `Open on a ${st.inRule === 'master' ? 'double or treble' : 'double'}` : status}</div>
      <div class="sub"><span>Avg <b>${fmt(stats[p].avg)}</b></span><span>Last <b>${last ? (last.bust ? 'Bust' : last.score) : '–'}</b></span><span>Darts <b>${legDarts}</b></span></div>
    </article>`;
  }).join('');

  // winner
  const wp = $('winnerPanel');
  if (S.matchWinner != null) {
    const w = stats[S.matchWinner];
    wp.hidden = false;
    wp.className = 'panel winner';
    const tally = st.unit === 'sets' ? sd.sets : sd.total;
    wp.innerHTML = `<h2>Match to ${esc(players()[S.matchWinner].name)}, ${tally[S.matchWinner]}–${players().map((_, p) => p).filter(p => p !== S.matchWinner).map(q => tally[q]).join('–') || 0}${st.unit === 'sets' ? ' in sets' : ''}</h2>
      <p style="margin:0 0 12px;color:var(--muted)">Match average ${fmt(w.avg)}, highest finish ${w.highFinish || '–'}.</p>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" type="button" data-act="rematch">Play again</button><button class="btn" type="button" data-act="new">Main menu</button></div>`;
  } else wp.hidden = true;

  // entry
  const human = turn >= 0 && players()[turn].type === 'human';
  const rem = turn >= 0 ? remaining(leg, turn) : 0;
  const ro = $('readout');
  const live = botReveal && botReveal.p === turn ? botReveal : null;
  const liveScore = live ? live.darts.reduce((a, d) => a + d.v, 0) : 0;
  ro.textContent = buffer || (live && live.darts.length ? String(liveScore) : human ? 'Enter score' : S.matchWinner != null ? 'Match over' : 'Bot throwing…');
  ro.classList.toggle('empty', !buffer && !(live && live.darts.length));
  $('who').innerHTML = turn >= 0 ? `<span class="label">To throw</span><br><b>${esc(players()[turn].name)}</b> needs ${rem}` : '';
  const canCO = human && E.minDarts(rem, st.out) <= 3 && (opened(leg, turn) || OPEN_SETS[st.inRule]?.has(rem));
  const quick = [26, 41, 45, 60, 81, 85, 100, 140, 180];
  $('quick').innerHTML =
    `<button class="chip zero" type="button" data-score="0" ${human ? '' : 'disabled'}>No score</button>` +
    quick.map(q => `<button class="chip" type="button" data-score="${q}" ${human ? '' : 'disabled'}>${q}</button>`).join('') +
    (canCO ? `<button class="chip co" type="button" data-score="${rem}" style="grid-column: span 2">Checkout ${rem}</button>` : '');
  $('keys').innerHTML = ['1', '2', '3', '4', '5', '6', '7', '8', '9', 'del', '0', 'ok'].map(k =>
    `<button class="key ${k === 'ok' ? 'ok' : k === 'del' ? 'fn' : ''}" type="button" data-key="${k}" ${human ? '' : 'disabled'} aria-label="${k === 'del' ? 'Delete digit' : k === 'ok' ? 'Submit score' : k}">${k === 'del' ? '⌫' : k === 'ok' ? 'Score' : k}</button>`).join('');

  highlight(route);
  const lastVisit = live ? { p: live.p, darts: live.darts, score: liveScore, bust: false, live: true } : lastVisitAnywhere();

  $('boardRoute').innerHTML = route ? routeChips(route) : turn >= 0 ? (!opened(leg, turn) ? `Open on a ${st.inRule === 'master' ? 'double or treble' : 'double'}` : rem > (st.out === 'double' ? 170 : 180) ? 'Scoring – aim T20' : 'No 3-dart finish') : '';

    ? `<span>${esc(players()[lastVisit.p].name)}${lastVisit.live ? ' is throwing' : "'s last visit"}:</span> ${lastVisit.darts.map((d, i) => `<span>${i + 1}. <b>${dartLabel(d)}</b></span>`).join('')} <span>= <b>${lastVisit.bust ? 'Bust' : lastVisit.score}</b></span>`

}
function lastVisitAnywhere() {

}
function renderSheet() {
  // Chalker's sheet: per player "Scored | Left", one row per round
  let leg = curLeg(), idx = S.legs.length;

  const pl = players();
  $('sheetTitle').textContent = S.settings.unit === 'sets' ? `Leg ${idx} · set ${(leg.set ?? 0) + 1}` : `Leg ${idx}`;

    }).join('');

// ---------- game flow ----------
function commitVisit(v) {

    const sd = standings();
    if (sd.matchWinner >= 0) {
      S.matchWinner = sd.matchWinner;
      toast(`Game shot and the match! ${v.score} checkout for ${players()[v.p].name}.`);
    } else {
      const setWon = S.settings.unit === 'sets' && sd.legsInSet === 0;
      S.legs.push({ starter: nextStarter(), visits: [], winner: null, set: sd.setsDone });
      toast(setWon ? `Game shot and the set! Set to ${players()[v.p].name}, ${sd.sets[v.p]}–${Math.max(...sd.sets.filter((_, q) => q !== v.p))} in sets.` : `Game shot! Leg to ${players()[v.p].name} in ${darts} darts.`);
    }
  } else if (v.bust) {
    toast(`${players()[v.p].name}: bust`);

}
function maybeBot() {

  if (!isBotTurn()) { botBusy = false; return; }
  botBusy = true;
  const token = botToken;
  const leg = curLeg(), p = turnOf(leg), pl = players()[p], ctx = botCtx(p);
  const rem = remaining(leg, p), out = S.settings.out;
  // Pressure: an opponent is on a finish, or checking out here wins the match
  const oppOn = players().some((_, q) => q !== p && E.minDarts(remaining(leg, q), out) <= 3);
  const matchDart = E.minDarts(rem, out) <= 3 && legWinsMatch(p);
  ctx.pressure = oppOn || matchDart ? E.pressureFor(ctx.avg) : 1;
  const r = E.simulateVisit(rem, out, E.profileFor(botAvg(pl)), ctx, { inRule: S.settings.inRule, opened: opened(leg, p) });

  botReveal = { p, darts: [] };
  render();
  let t = 700 + Math.random() * 300, left = rem;
  r.darts.forEach(d => {
    if (out !== 'single' && E.BY[d.aim] && E.isFinisher(E.BY[d.aim], out) && E.BY[d.aim].v === left) t += 400 + Math.random() * 400;
    setTimeout(() => { if (token !== botToken) return; botReveal.darts.push(d); render(); }, t);

}

function submit(score) {
  if (isBotTurn() || S.matchWinner != null) return;
  const st = S.settings, leg = curLeg(), p = turnOf(leg), rem = remaining(leg, p), out = st.out, dbl = out !== 'single';
  const finisher = out === 'master' ? 'a double or treble' : 'a double';
  const atLabel = out === 'master' ? 'Darts at a double or treble' : 'Darts at double';

  if (!E.validVisit(score)) return err(score > 180 ? 'The most three darts can score is 180.' : `${score} can't be scored with three darts.`);
  if (!opened(leg, p) && !OPEN_SETS[st.inRule].has(score)) return err(`${score} isn't possible when the visit has to open on ${st.inRule === 'master' ? 'a double or treble' : 'a double'}.`);

    const finish = atDouble => commitVisit({ ...base, score: 0, dartsUsed: 3, dartsAtDouble: atDouble, bust: true, checkout: false });
    return canAimDouble ? ask('Bust', `How many darts did ${players()[p].name} throw at ${finisher}?`, [{ key: 'd', label: atLabel, options: [0, 1, 2, 3], def: 1 }], a => finish(a.d)) : finish(0);
  }
  if (score === rem) {
    const md = E.minDarts(rem, out);
    if (md > 3) return err(dbl ? `${rem} can't be checked out on ${finisher} in three darts.` : `${rem} can't be checked out in three darts.`);
    const finish = (used, at) => commitVisit({ ...base, score, dartsUsed: used, dartsAtDouble: dbl ? at : 0, bust: false, checkout: true });
    if (md === 3 && dbl) return finish(3, 1);
    const qs = [{ key: 'used', label: 'Darts used', options: range(md, 3), def: md }];
    if (dbl) qs.push({ key: 'at', label: atLabel, options: a => range(1, a.used - md + 1), def: 1 });
    return ask(`Checkout ${rem}`, 'How did the finish go?', qs, a => finish(a.used, a.at || 1));
  }
  if (canAimDouble) return ask(`${score} scored`, `${rem} was on. How many darts went at ${finisher}?`, [{ key: 'd', label: atLabel, options: [0, 1, 2, 3], def: 0 }],
    a => commitVisit({ ...base, score, dartsUsed: 3, dartsAtDouble: a.d, bust: false, checkout: false }));

}

      + optRow('Format', 'kind', [['firstTo', 'First to'], ['bestOf', 'Best of']], st.kind, 'x01')
      + `<div class="field"><label class="label" for="countSel">${st.kind === 'bestOf' ? 'Best of' : 'First to'}</label><select id="countSel">${counts.map(c => `<option value="${c}" ${st.count === c ? 'selected' : ''}>${c} ${st.unit === 'sets' ? 'set' : 'leg'}${c > 1 ? 's' : ''}</option>`).join('')}</select></div>`
      + (st.unit === 'sets' ? `<div class="field"><label class="label" for="setLegsSel">Each set is first to</label><select id="setLegsSel">${range(1, 6).map(c => `<option value="${c}" ${st.setLegs === c ? 'selected' : ''}>${c} leg${c > 1 ? 's' : ''}</option>`).join('')}</select></div>` : '')
      + optRow('Two clear legs', 'twoClear', [[false, 'Off'], [true, 'On']], st.twoClear, 'x01')
      + optRow('Throws first', 'first', [['p1', 'Player 1'], ['random', 'Random']], st.first, 'x01');
  };
  const gameHTML = () => (G?.options || []).map(d => optRow(d.label, d.key, d.choices, st.opts[mode]?.[d.key] ?? d.def, 'game')).join('');
  const draw = () => {
    const x01 = mode === 'x01';
    ov.innerHTML = `<form class="dialog" id="setupForm" aria-label="${esc(x01 ? 'X01' : G.title)} setup"><h3>${miniBoard(mode)}${esc(x01 ? 'X01' : G.title)}</h3>
      ${x01 ? x01HTML() : gameHTML()}
      <div class="field"><span class="label">${hi === 1 ? 'Player' : `Players (${lo === hi ? lo : `${lo}–${hi}`})`}</span>
        <div class="plist">${list.map(rowHTML).join('')}</div>
        ${list.length < hi ? `<div class="opts"><button type="button" class="opt" data-set="padd" data-v="bot">+ Add bot</button><button type="button" class="opt" data-set="padd" data-v="human">+ Add player</button></div>` : ''}
      </div>
      ${!x01 ? `<p class="rules">${G.rules}</p>` : ''}
      <div class="actions"><button type="button" class="btn" data-act="cancel">Cancel</button><button type="submit" class="btn primary">Start</button></div></form>`;
  };
  const sync = () => {
    if (!$('setupForm')) return;
    if ($('countSel')) st.count = +$('countSel').value;
    if ($('setLegsSel')) st.setLegs = +$('setLegsSel').value;
    if ($('startIn')) { const v = Math.round(+$('startIn').value); st.start = v >= 2 && v <= 9999 ? v : 501; }
    list.forEach((p, i) => {
      const nm = $('pn' + i); if (nm) p.name = nm.value.trim() || (i === 0 ? 'You' : p.type === 'bot' ? 'Bot' : `Player ${i + 1}`);
      const av = $('pa' + i); if (av) p.avg = +av.value;
    });
  };
  draw();
  ov.hidden = false; dialogOpen = true;
  const close = () => { ov.hidden = true; ov.innerHTML = ''; ov.onclick = ov.oninput = ov.onsubmit = null; dialogOpen = false; dialogKey = null; };
  ov.onclick = e => {
    const b = e.target.closest('button');
    if (!b) { if (e.target === ov) close(); return; }
    if (b.dataset.set) {
      sync();
      const v = b.dataset.v, i = +b.dataset.i, set = b.dataset.set;
      if (set === 'o') {
        const key = b.dataset.key, val = v === 'true' ? true : v === 'false' ? false : /^-?\d+$/.test(v) ? +v : v;
        if (b.dataset.scope === 'game') st.opts[mode] = { ...(st.opts[mode] || {}), [key]: val };
        else if (key === 'startPick') st.start = val === 'custom' ? ([301, 501, 701].includes(st.start) ? 1001 : st.start) : val;
        else if (key === 'kind' && val !== st.kind) { st.count = val === 'bestOf' ? Math.min(21, 2 * st.count - 1) : Math.floor(st.count / 2) + 1; st.kind = val; }
        else st[key] = val;
      }
      if (set === 'ptype') { list[i].type = v; if (isDefaultName(list[i].name)) list[i].name = v === 'bot' ? 'Bot' : 'Player'; renumber(); }
      if (set === 'premove') { list.splice(i, 1); renumber(); }
      if (set === 'padd') { list.push({ name: v === 'bot' ? 'Bot' : 'Player', type: v, avg: 50 }); renumber(); }
      draw();
      (ov.querySelector(`[data-set="${set}"][data-v="${v}"]${set === 'ptype' ? `[data-i="${i}"]` : set === 'o' ? `[data-key="${b.dataset.key}"]` : ''}`) || ov.querySelector('[type=submit]'))?.focus();
    } else if (b.dataset.act === 'cancel') close();
  };
  ov.oninput = e => {
    if (!e.target.id.startsWith('pa')) return;
    const i = +e.target.dataset.i;
    list[i].avg = +e.target.value;
    e.target.previousElementSibling.textContent = avgText(list[i].avg);
  };
  ov.onsubmit = e => {
    e.preventDefault(); sync();
    st.players = list.map(p => p.type === 'bot' ? { name: p.name, type: 'bot', avg: p.avg } : { name: p.name, type: 'human' });
    close();
    startMatch(st);
  };
  dialogKey = e => { if (e.key === 'Escape') { close(); return true; } return false; };
  ov.querySelector('[type=submit]').focus();
}
function startMatch(settings) {
  cancelBot(); botBusy = false;
  S = freshMatch(settings); buffer = '';
  save(); render(); maybeBot();
}

// ---------- input ----------
function press(k) {
  if (isGame()) {
    const G = GAMES[S.settings.mode];
    if (!G.keypad || G.done(S.game) || isBotTurn()) return;
    if (k === 'ok') return gameAct('score', buffer);
  } else if (isBotTurn() || S.matchWinner != null) return;
  if (k === 'del') buffer = buffer.slice(0, -1);
  else if (k === 'ok') return submit(buffer === '' ? NaN : +buffer);
  else if (/^\d$/.test(k)) { if (buffer.length < 3) buffer = (buffer === '0' ? '' : buffer) + k; }
  render();
}
document.addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b || b.disabled || b.closest('#overlay')) return;
  if (b.dataset.key) press(b.dataset.key);
  else if (b.dataset.ga) gameAct(b.dataset.ga, b.dataset.v);
  else if (b.dataset.act === 'undo') undo();
  else if (b.dataset.score != null) { buffer = ''; submit(+b.dataset.score); }
  else if (b.dataset.act === 'rematch') startMatch(S.settings);
  else if (b.dataset.act === 'new') goMenu();
  else if (b.dataset.menu) openSetup(b.dataset.menu);
  else if (b.dataset.act === 'continue') { S.screen = 'play'; save(); render(); maybeBot(); }
});
document.addEventListener('keydown', e => {
  if (dialogOpen) { if (dialogKey && dialogKey(e)) e.preventDefault(); return; }
  if (S.screen === 'menu') return;
  if (e.target.matches('input, select, textarea')) return;
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); undo(); return; }
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (isGame() && !GAMES[S.settings.mode].keypad) {
    const b = document.querySelector(`#gameLeft [data-hot="${CSS.escape(e.key.toLowerCase())}"]:not(:disabled)`);
    if (b) { b.click(); e.preventDefault(); }
    return;
  }
  if (/^\d$/.test(e.key)) { press(e.key); e.preventDefault(); }
  else if (e.key === 'Backspace') { press('del'); e.preventDefault(); }
  else if (e.key === 'Enter' && !e.target.closest('button')) { press('ok'); e.preventDefault(); }
});
$('undoBtn').addEventListener('click', undo);
$('menuBtn').addEventListener('click', goMenu);
$('brand').addEventListener('click', () => { if (S.screen !== 'menu' && !dialogOpen) goMenu(); });
$('logo').innerHTML = miniBoard('logo');
$('rematchBtn').addEventListener('click', () => startMatch(S.settings));

// ---------- boot ----------
function start(data) {
  const saved = (data && data.S) || load();
  S = saved || freshMatch(DEFAULT_SETTINGS);
  S.settings.mode = S.settings.mode || 'x01';
  if (S.settings.mode === 'x01') normX01(S.settings);
  S.hist = S.hist || [];
  if (isGame() && (!GAMES[S.settings.mode] || !S.game)) S = freshMatch(DEFAULT_SETTINGS);
  // First visit opens on the menu; a saved game picks up where it was
  S.screen = saved ? (S.screen || 'play') : 'menu';
  buildBoard();
  render();
  maybeBot();
}
window.claude?.hot?.snapshot?.(() => ({ S }));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
