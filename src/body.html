
<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1 id="brand" title="Main menu" data-ta="title"><span class="logo" id="logo"></span><span>Oche<span class="dot">.</span></span></h1>
      <div class="meta" id="meta"></div>
    </div>
    <div class="hbtns">
      <button class="btn" id="rematchBtn" type="button" data-t>Restart</button>
      <button class="btn primary" id="menuBtn" type="button" data-t>Menu</button>
    </div>
  </header>

  <nav class="tabs" id="tabs" aria-label="Sections" data-ta="aria-label" hidden>
    <button type="button" data-nav="menu" data-t>Play</button>
    <button type="button" data-nav="history" data-t>History</button>
    <button type="button" data-nav="stats" data-t>Stats</button>
    <button type="button" data-nav="settings" data-t>Settings</button>
  </nav>

  <div class="menu" id="menu" hidden></div>
  <div class="page" id="page" hidden></div>

  <div class="grid" id="play">
    <div class="col">
      <div class="col" id="gameLeft" hidden></div>
      <div class="col" id="x01Left">
      <section class="players" id="players" aria-label="Scoreboard" data-ta="aria-label"></section>
      <section class="panel" id="winnerPanel" hidden></section>
      <section class="panel entry" aria-label="Score entry" data-ta="aria-label">
        <div class="readout">
          <div class="val num" id="readout"></div>
          <div class="who" id="who"></div>
        </div>
        <div class="msg" id="msg" role="status" aria-live="polite"></div>
        <div class="quick" id="quick"></div>
        <div class="keys" id="keys"></div>
        <div class="row-actions">
          <button class="btn" id="undoBtn" type="button" data-t>Undo last visit</button>
          <span class="hint"><span class="kb" data-t>Keys: <kbd>Enter</kbd> to score · <kbd>Ctrl</kbd>+<kbd>Z</kbd> undo</span></span>
        </div>
      </section>
      </div>
    </div>

    <div class="col">
      <section class="panel board-panel" aria-label="Dartboard" data-ta="aria-label">
        <div class="cap">
          <span class="label" id="boardLabel">Checkout route</span>
          <span class="cap-route" id="boardRoute"></span>
        </div>
        <svg class="board" id="board" viewBox="-200 -200 400 400" role="img" aria-labelledby="boardLabel boardRoute"></svg>
        <div class="darts-legend" id="legend"></div>
      </section>
      <div class="col" id="gameRight" hidden></div>
      <div class="col" id="x01Right">
      <section class="panel chalk">
        <div class="h2row"><h2 id="sheetTitle">Leg 1</h2><span class="label" id="sheetNote"></span></div>
        <div class="sheet-wrap"><table class="sheet" id="sheet"></table></div>
      </section>
      <section class="panel">
        <h2 data-t>Match stats</h2>
        <div class="sheet-wrap"><table class="stats" id="stats"></table></div>
      </section>
      </div>
    </div>
  </div>
</div>

<div class="overlay" id="overlay" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
